services:
  postgres:
    image: postgres:16-alpine
    container_name: medivault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medivault_dev}
    ports:
      # Bound strictly to 127.0.0.1 (local machine only) on dedicated port 5434 to avoid host conflicts
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medivault_dev}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: medivault_postgres_data
